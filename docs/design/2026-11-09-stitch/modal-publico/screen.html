<!DOCTYPE html>

<html lang="es-MX"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detalle de prenda - LoloShop</title>
<!-- Google Fonts: Plus Jakarta Sans, Public Sans & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              primary: "#007272",
              pressed: "#005F5F",
              ink: "#16302F",
              secondary: "#5C6E6D",
              border: "#7F9392",
              line: "#E1E9E9",
              block: "#F3F7F7",
              neutralBg: "#F0F3F3",
              success: "#1F7A4A",
              danger: "#9A3B2E"
            }
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {},
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Public Sans", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          },
          fontSize: {}
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    /* Diagonal strike for sold-out size chip */
    .sold-out-chip {
      position: relative;
      overflow: hidden;
    }
    .sold-out-chip::after {
      content: "";
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 1.5px;
      background-color: #9A3B2E;
      transform: rotate(-45deg);
      pointer-events: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-neutral-800/40 font-body text-brand-ink antialiased min-h-screen flex items-end sm:items-center justify-center p-0 sm:p-4">
<!-- Mobile Simulator Sheet Container (375px) -->
<main aria-labelledby="dialog-title" aria-modal="true" class="w-full max-w-[375px] bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[813px] overflow-hidden relative" role="dialog">
<!-- Top Drag Handle & Sheet Header -->
<header class="sticky top-0 z-50 flex items-center justify-between w-full h-14 px-4 bg-white border-b border-[#E1E9E9]">
<div aria-hidden="true" class="w-11 h-11 flex items-center justify-start text-transparent select-none pointer-events-none">
<span class="material-symbols-outlined">menu</span>
</div>
<h1 class="font-headline text-base font-bold text-[#16302F]" id="dialog-title">Detalle de prenda</h1>
<button aria-label="Cerrar" class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-full text-brand-secondary hover:bg-[#F3F7F7] active:opacity-80 transition-colors transition-opacity" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</header>
<!-- Scrollable Dialog Content Canvas -->
<div class="overflow-y-auto px-4 pt-3 pb-6 flex flex-col gap-5">
<!-- 2. Área de Fotos -->
<section aria-label="Galería de fotos de la prenda" class="flex flex-col gap-2.5">
<!-- Main Photo Preview Box -->
<div class="relative w-full aspect-square bg-[#F0F3F3] rounded-2xl flex flex-col items-center justify-center overflow-hidden border border-[#E1E9E9]">
<div class="flex flex-col items-center justify-center gap-2 select-none text-brand-secondary">
<span class="material-symbols-outlined text-4xl text-brand-secondary/70">photo_camera</span>
<span class="text-xs font-mono uppercase tracking-wider font-medium text-brand-secondary">Foto de frente</span>
</div>
<!-- Discreto indicador de paginación numérico -->
<div class="absolute bottom-3 right-3 bg-white/90 backdrop-blur-none px-2.5 py-1 rounded-full border border-[#E1E9E9]">
<span class="font-mono text-xs font-medium text-brand-ink">1 / 2</span>
</div>
</div>
<!-- Miniaturas de Carrusel y Selección -->
<div class="flex items-center justify-between gap-3 pt-0.5">
<div class="flex gap-2.5">
<!-- Miniatura 1 (Frente - Seleccionada) -->
<button aria-label="Ver foto de frente (seleccionada)" class="w-14 h-14 rounded-xl bg-[#F0F3F3] border-2 border-brand-ink p-1 flex flex-col items-center justify-center focus:outline-none transition-all" type="button">
<span class="material-symbols-outlined text-lg text-brand-ink">image</span>
<span class="font-mono text-[10px] text-brand-ink font-semibold">Frente</span>
</button>
<!-- Miniatura 2 (Atrás) -->
<button aria-label="Ver foto de atrás" class="w-14 h-14 rounded-xl bg-[#F0F3F3] border border-[#E1E9E9] p-1 flex flex-col items-center justify-center text-brand-secondary hover:border-brand-secondary focus:outline-none transition-all" type="button">
<span class="material-symbols-outlined text-lg text-brand-secondary">image</span>
<span class="font-mono text-[10px] text-brand-secondary">Atrás</span>
</button>
</div>
<!-- Paginación de dos puntitos sutiles -->
<div aria-hidden="true" class="flex items-center gap-1.5 pr-2">
<span class="w-2 h-2 rounded-full bg-brand-ink"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#E1E9E9]"></span>
</div>
</div>
</section>
<!-- 3. Información de Producto -->
<section class="flex flex-col gap-1 border-t border-[#E1E9E9] pt-3">
<!-- Marca: Mono, 12px, mayúsculas, tracking amplio -->
<p class="font-mono text-xs uppercase tracking-widest text-brand-secondary font-medium">MARCA EJEMPLO</p>
<!-- Nombre de prenda -->
<h2 class="text-xl font-normal text-brand-ink leading-tight">Playera ejemplo</h2>
<!-- Precio destacado -->
<div class="pt-1">
<span class="font-headline font-bold text-2xl tracking-tight text-brand-ink">$000</span>
</div>
</section>
<!-- 4. Sección Talla -->
<section class="flex flex-col gap-2.5">
<h3 class="text-sm font-medium text-brand-ink">Talla</h3>
<!-- Chips de 48x48px en tipografía Mono -->
<div aria-label="Selección de talla" class="flex items-center gap-2.5" role="radiogroup">
<!-- S: Agotada con diagonal tachada -->
<button aria-label="Talla S agotada" class="sold-out-chip w-12 h-12 rounded-xl border border-[#E1E9E9] bg-[#F3F7F7]/60 text-brand-secondary/50 font-mono text-sm font-medium flex items-center justify-center cursor-not-allowed select-none" disabled="" type="button">
            S
          </button>
<!-- M: Seleccionada (relleno tinta #16302F, texto blanco) -->
<button aria-checked="true" aria-label="Talla M seleccionada" class="w-12 h-12 rounded-xl bg-brand-ink text-white font-mono text-sm font-semibold flex items-center justify-center focus:outline-none ring-2 ring-brand-ink ring-offset-1" type="button">
            M
          </button>
<!-- L: Disponible (borde gris, texto neutro) -->
<button aria-checked="false" aria-label="Talla L disponible" class="w-12 h-12 rounded-xl border border-brand-border bg-white text-brand-ink font-mono text-sm font-medium flex items-center justify-center hover:bg-[#F3F7F7] active:scale-95 transition-all" type="button">
            L
          </button>
<!-- XL: Disponible (borde gris, texto neutro) -->
<button aria-checked="false" aria-label="Talla XL disponible" class="w-12 h-12 rounded-xl border border-brand-border bg-white text-brand-ink font-mono text-sm font-medium flex items-center justify-center hover:bg-[#F3F7F7] active:scale-95 transition-all" type="button">
            XL
          </button>
</div>
<p class="text-xs text-brand-secondary font-normal">Tachada = agotada</p>
</section>
<!-- 5. Línea de Disponibilidad -->
<section class="flex items-center gap-2 pt-1">
<span aria-hidden="true" class="w-2.5 h-2.5 rounded-full bg-brand-success flex-shrink-0"></span>
<span class="text-sm font-medium text-brand-ink">Disponible en tienda</span>
</section>
<!-- 6. Nota de Referencia y Código -->
<section class="py-1">
<p class="font-mono text-xs text-brand-secondary">Código EJ-0000 · menciónalo al escribirnos</p>
</section>
<!-- 7. Acción Principal (CTA) -->
<section class="flex flex-col gap-2 pt-2">
<button class="w-full h-14 bg-brand-primary text-white rounded-xl font-headline font-semibold text-base flex items-center justify-center gap-2.5 shadow-sm active:bg-brand-pressed active:scale-[0.99] transition-all min-h-[48px]" type="button">
<!-- WhatsApp Icon -->
<span class="material-symbols-outlined text-[22px] fill">chat</span>
<span>Consultar por WhatsApp</span>
</button>
<p class="text-xs text-center text-brand-secondary font-normal">Te responde la tienda por WhatsApp.</p>
</section>
<!-- 8. Estado Alternativo al pie de la Modal -->
<aside class="rounded-xl border border-[#E1E9E9] bg-brand-block p-3.5 mt-1 flex flex-col gap-1">
<h4 class="text-xs font-semibold text-brand-ink">Sin número configurado:</h4>
<p class="text-xs text-brand-secondary font-normal leading-relaxed">Consulta disponibilidad en tienda.</p>
</aside>
</div>
</main>
</body></html>
